[package]
name = "veda-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "veda-server"
path = "src/main.rs"

[dependencies]
veda-types.workspace = true
veda-core.workspace = true
veda-store.workspace = true
veda-pipeline.workspace = true
veda-sql.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = "0.8"
base64 = "0.22"
async-stream = "0.3"
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "catch-panic"] }
tokio-util = "0.7"
argon2 = "0.5"
toml = "0.8"
arrow = { version = "58", features = ["json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
# Outbox lease owner identity (host part of "host:pid").
gethostname = "0.5"
# Socket activation (systemd .socket / systemfd): inherit the listener via
# LISTEN_FDS so restarts never close the port. See docs/deploy.md.
listenfd = "1"

# OTLP metrics bridge → company Monitor Collector (gRPC). See proto/PROVENANCE.md.
# Hand-rolled exporter (no opentelemetry-rust): the Collector needs the legacy
# proto (InstrumentationLibraryMetrics + deprecated labels) the official crates
# dropped. veda otherwise has zero gRPC deps (Milvus is REST).
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
prost = "0.13"
prometheus-parse = "0.2"
serde_yaml = "0.9"
# Promoted from dev-dependencies: OTLP collector discovery hits the company
# config service over HTTP at runtime.
reqwest = { workspace = true }
# Promoted from dev-dependencies: the platform tunnel-bot API writes the
# shared veda_tunnel_bots table directly (see src/tunnel_bots.rs).
sqlx = { version = "0.8", features = ["mysql", "chrono", "json", "runtime-tokio-rustls"] }
# RFC 5987 filename* encoding for platform file downloads (already in the
# dep tree via axum).
percent-encoding = "2"

[dev-dependencies]
toml = "0.8"
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
serde_urlencoded = "0.7"
http-body-util = "0.1"

[build-dependencies]
# Generates the OTLP gRPC client from vendored proto. protoc-bin-vendored ships
# a protoc binary so build hosts (.161 dogfood, CI) need no system protoc.
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }
protoc-bin-vendored = "3"
